[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pyeidors"
version = "2.0.0"
description = "PyEIDORS - A FEniCSx-based Framework for Forward and Inverse Problems in Electrical Impedance Tomography (EIT)"
readme = "README.md"
requires-python = ">=3.13,<3.14"
license = {text = "MIT"}
authors = [
    {name = "BingZhou Chen", email = "b20223080651@cau.edu.cn"},
]
keywords = ["EIT", "EIDORS", "FEniCSx", "inverse problems", "medical imaging", "pytorch"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Scientific/Engineering :: Plants/Animals Science Apps",
]

dependencies = [
    "numpy>=1.26,<3",
    "scipy>=1.12",
    "matplotlib>=3.8",
    "pandas>=2.0",
    "h5py>=3.11",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# FEniCSx note:
# - DOLFINx/Basix/UFL/FFCx are provided by the Nix devShell (see flake.nix).
# - This extra only adds Python-level companions and does not install DOLFINx itself.
fenicsx = [
    "mpi4py>=3.1",
    "meshio>=5.3",
    "gmsh>=4.11",
]
torch = [
    "torch~=2.10.0",
]
cuqi = [
    "CUQIpy~=1.5.0",
]
performance = [
    "pyamg>=5.2",
    "scikit-sparse>=0.4.12,<0.5",
]
# Development dependencies
dev = [
    "pytest>=6.2.0",
    "pytest-cov>=3.0.0",
]
# Documentation dependencies
docs = [
    "sphinx>=4.0.0", 
    "sphinx-rtd-theme>=1.0.0",
    "jupyter>=1.0.0",
    "nbsphinx>=0.8.0"
]
# Visualization extras
viz = [
    "pyvista>=0.37.0",
    "vtk>=9.0.0"
]
# EIT Workstation GUI application
eit-app = [
    "PySide6>=6.6",
    "pyqtgraph>=0.13",
    "pyserial>=3.5",
    "pyvista>=0.45",
    "pyvistaqt>=0.11",
]

[project.urls]
Homepage = "https://github.com/CBZ199671/PyEIDORS"
Documentation = "https://github.com/CBZ199671/PyEIDORS#readme"
Repository = "https://github.com/CBZ199671/PyEIDORS.git"
"Bug Tracker" = "https://github.com/CBZ199671/PyEIDORS/issues"

[project.scripts]
eit-app = "eit_app.app:main"
eit-backend-worker = "eit_app.backend_worker:main"
eit-backend-doctor = "eit_app.backend_doctor:main"
eit-cache = "pyeidors.cache.cli:main"
pyeidors-block-real-amgx = "pyeidors.forward.block_real_amgx:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pyeidors = ["*.yaml", "*.yml", "data/*"]
eit_app = ["assets/*.svg", "assets/*.png"]

[tool.ruff.lint.per-file-ignores]
"scripts/**/*.py" = ["E402"]
"tests/**/*.py" = ["E402"]
"src/eit_app/app.py" = ["E402"]
"src/pyeidors/inverse/solvers/gauss_newton_runtime.py" = ["E402"]
# Qt model/view overrides intentionally mirror Qt's QModelIndex() default args.
"src/eit_app/ui/database/database_tab.py" = ["B008"]
"src/eit_app/ui/hardware/frame_browser_widget.py" = ["B008"]
"src/eit_app/ui/simulation/inhomogeneity_editor.py" = ["B008"]
# These modules intentionally dispatch through validated dynamic attribute names.
"scripts/benchmarks/benchmark_difference_runtime.py" = ["B010"]
"scripts/common/acceleration_profiles.py" = ["B010"]
"src/eit_app/controllers/forward_solver_controller.py" = ["B010"]
"src/eit_app/controllers/reconstruction_controller.py" = ["B010"]
"src/pyeidors/cache/object_signature.py" = ["B010"]
"src/pyeidors/geometry/optimized_mesh_generator.py" = ["B010"]
"src/pyeidors/inverse/greit.py" = ["B009"]
"tests/unit/test_misc_entrypoint_facade_branches.py" = ["B009"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --cov=src/pyeidors --cov-report=html --cov-report=term-missing --cov-fail-under=87"
filterwarnings = [
    "error",
    "ignore:Exception ignored.*proc/cpuinfo.*:pytest.PytestUnraisableExceptionWarning",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "gpu: marks tests that require GPU",
    "integration: marks integration tests excluded from the default quick suite",
    "fenicsx: marks tests that require FEniCSx/DOLFINx",
    "cuqi: marks tests that require CUQIpy",
    "gui: marks tests requiring PySide6 GUI",
    "hardware: marks tests requiring physical EIT hardware",
]

[tool.coverage.report]
precision = 2
