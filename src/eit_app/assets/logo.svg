<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 96"
     role="img" aria-label="EIT Workstation — Impedance Tomography">
  <!--
    EIT Workstation brand mark · v2.

    Reworked per design system feedback to:
      1. Drop the bilingual descriptor in favour of an English-only
         wordmark — the workstation is a global research tool and the
         logo doubles as a header in English-language docs / READMEs.
      2. Adopt a flat, FEniCSx-style monogram instead of layered 3D
         gradients: a confident two-tone tomographic cross-section
         (one prominent dark σ band + a softer secondary band) ringed
         by 8 electrodes with the active drive pair highlighted in
         amber.  Reads as a single symbol, not a busy diagram.
      3. Pair the mark with a bold "EIT" cap, a thin separator stroke,
         a "Workstation" sub-word, and a tracked "IMPEDANCE TOMOGRAPHY"
         descriptor — same composition pattern as the design system
         preview file.
  -->
  <defs>
    <linearGradient id="wmInk" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a6fa0"/>
      <stop offset="1" stop-color="#153a58"/>
    </linearGradient>
    <clipPath id="discClip">
      <circle cx="0" cy="0" r="30"/>
    </clipPath>
  </defs>

  <!-- Disc + electrode ring, centred at (48, 48) -->
  <g transform="translate(48 48)">
    <!-- Cool background fill — same blue-grey canvas tint as the app. -->
    <circle r="30" fill="#eef3f8" stroke="#1f5d8b" stroke-width="2.6"/>

    <!-- Two conductivity bands clipped to the disc.  Upper band is
         the prominent anomaly; lower band is a softer secondary
         feature.  The shapes are the kind of curved boundaries you
         actually see in a NOSER/Gauss-Newton σ reconstruction. -->
    <g clip-path="url(#discClip)">
      <path d="M -30 -6 Q -15 -22 0 -16 Q 15 -10 30 -22 L 30 -30 L -30 -30 Z"
            fill="#1f5d8b" opacity="0.92"/>
      <path d="M -30 -6 Q -15 -22 0 -16 Q 15 -10 30 -22"
            fill="none" stroke="#ffffff" stroke-width="1.2" opacity="0.55"/>

      <path d="M -30 8 Q -12 -2 0 6 Q 14 16 30 4 L 30 30 L -30 30 Z"
            fill="#2a6fa0" opacity="0.55"/>
    </g>

    <!-- Re-stroke the rim on top of the clipped bands so the boundary
         line stays crisp regardless of the σ band fills. -->
    <circle r="30" fill="none" stroke="#1f5d8b" stroke-width="2.6"/>

    <!-- 8 electrodes evenly distributed around the disc.  Two of them
         (left + right at 0°/180°) are highlighted amber to mark the
         currently active drive pair. -->
    <g fill="#1f5d8b">
      <circle cx="30.000"  cy="0.000"   r="3.2"/>
      <circle cx="21.213"  cy="21.213"  r="3.2"/>
      <circle cx="0.000"   cy="30.000"  r="3.2"/>
      <circle cx="-21.213" cy="21.213"  r="3.2"/>
      <circle cx="-30.000" cy="0.000"   r="3.2"/>
      <circle cx="-21.213" cy="-21.213" r="3.2"/>
      <circle cx="0.000"   cy="-30.000" r="3.2"/>
      <circle cx="21.213"  cy="-21.213" r="3.2"/>
    </g>
    <circle cx="30.000"  cy="0.000" r="3.2" fill="#f39c12"/>
    <circle cx="-30.000" cy="0.000" r="3.2" fill="#f39c12"/>
  </g>

  <!-- "EIT" cap in heavy weight, tightly tracked. -->
  <g transform="translate(102 60)"
     font-family="'Segoe UI', 'Noto Sans SC', system-ui, sans-serif"
     font-weight="800" letter-spacing="-0.5">
    <text x="0" y="0" font-size="38" fill="url(#wmInk)">EIT</text>
  </g>

  <!-- Thin vertical separator between cap and sub-wordmark. -->
  <line x1="180" y1="28" x2="180" y2="68"
        stroke="#1f5d8b" stroke-width="1.2" opacity="0.45"/>

  <!-- "Workstation" + tracked descriptor. -->
  <g transform="translate(192 46)"
     font-family="'Segoe UI', 'Noto Sans SC', system-ui, sans-serif">
    <text x="0" y="0" font-size="22" font-weight="600"
          fill="#243447" letter-spacing="0.3">Workstation</text>
    <text x="0" y="18" font-size="9" font-weight="600"
          fill="#5b6573" letter-spacing="2"
          style="text-transform:uppercase">
      IMPEDANCE TOMOGRAPHY
    </text>
  </g>
</svg>
