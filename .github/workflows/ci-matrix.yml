name: CI Matrix

on:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  lint-guard:
    name: FEniCSx Hardcut Guard
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v16

      - name: Enable Nix cache
        uses: DeterminateSystems/magic-nix-cache-action@v9

      - name: Run FEniCSx hard-cut guard
        run: |
          nix --extra-experimental-features "nix-command flakes" develop -c \
            python scripts/ci/fenicsx_hardcut_guard.py

  tests-core:
    name: Core Tests (${{ matrix.os }})
    needs: lint-guard
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v16

      - name: Enable Nix cache
        uses: DeterminateSystems/magic-nix-cache-action@v9

      - name: Install package and run full pytest (coverage gate)
        env:
          KMP_DUPLICATE_LIB_OK: "TRUE"
          OMP_NUM_THREADS: "1"
        run: |
          nix --extra-experimental-features "nix-command flakes" develop -c bash -lc '
            scripts/env/sync_locked_env.sh --repair
            scripts/env/sync_locked_env.sh --check
            python scripts/env/verify_env_manifest.py
            python -c "import dolfinx, torch, cuqi, pyeidors"
            python -m pytest -q \
              --cov=src/pyeidors \
              --cov-report=xml:coverage.xml \
              --cov-report=html:htmlcov \
              --cov-report=term-missing \
              --cov-fail-under=85 | tee pytest.log
          '

      - name: Upload core artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: core-${{ matrix.os }}
          path: |
            coverage.xml
            htmlcov
            pytest.log
          if-no-files-found: warn

  tests-gmsh:
    name: Gmsh Mandatory (${{ matrix.os }})
    needs: lint-guard
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v16

      - name: Enable Nix cache
        uses: DeterminateSystems/magic-nix-cache-action@v9

      - name: Run gmsh mandatory test suite
        env:
          KMP_DUPLICATE_LIB_OK: "TRUE"
          OMP_NUM_THREADS: "1"
        run: |
          nix --extra-experimental-features "nix-command flakes" develop -c bash -lc '
            scripts/env/sync_locked_env.sh --repair
            scripts/env/sync_locked_env.sh --check
            python scripts/env/verify_env_manifest.py
            python -c "import dolfinx, torch, cuqi, pyeidors"
            python -m pytest -q \
              tests/integration/test_gmsh_mandatory.py \
              tests/unit/test_mesh_pipeline_extended.py \
              tests/unit/test_mesh_generation.py \
              tests/unit/test_real_mesh_generation.py | tee pytest-gmsh.log
          '

      - name: Upload gmsh artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gmsh-${{ matrix.os }}
          path: |
            pytest-gmsh.log
          if-no-files-found: warn

  perf-guard-linux:
    name: Perf Guard (Linux, Blocking)
    needs: tests-core
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v16

      - name: Enable Nix cache
        uses: DeterminateSystems/magic-nix-cache-action@v9

      - name: Run baseline/optimized snapshots and perf guard
        env:
          KMP_DUPLICATE_LIB_OK: "TRUE"
          OMP_NUM_THREADS: "1"
        run: |
          nix --extra-experimental-features "nix-command flakes" develop -c bash -lc '
            scripts/env/sync_locked_env.sh --repair
            scripts/env/sync_locked_env.sh --check
            python scripts/env/verify_env_manifest.py
            python -c "import dolfinx, torch, cuqi, pyeidors"
            python scripts/ci/perf_snapshot.py --mode baseline --repeat 5 --output test_results/perf/baseline.json
            python scripts/ci/perf_snapshot.py --mode optimized --repeat 5 --output test_results/perf/optimized.json
            python scripts/ci/perf_guard.py \
              --baseline test_results/perf/baseline.json \
              --optimized test_results/perf/optimized.json \
              --report test_results/perf/comparison.md \
              --min-improvement 0.50 \
              --max-regression 0.05
          '

      - name: Upload perf artifacts (linux)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: perf-linux
          path: |
            test_results/perf/baseline.json
            test_results/perf/optimized.json
            test_results/perf/comparison.md
          if-no-files-found: warn

  perf-guard-macos:
    name: Perf Guard (macOS, Record)
    needs: tests-core
    runs-on: macos-14
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v16

      - name: Enable Nix cache
        uses: DeterminateSystems/magic-nix-cache-action@v9

      - name: Run baseline/optimized snapshots and perf guard
        env:
          KMP_DUPLICATE_LIB_OK: "TRUE"
          OMP_NUM_THREADS: "1"
        run: |
          nix --extra-experimental-features "nix-command flakes" develop -c bash -lc '
            scripts/env/sync_locked_env.sh --repair
            scripts/env/sync_locked_env.sh --check
            python scripts/env/verify_env_manifest.py
            python -c "import dolfinx, torch, cuqi, pyeidors"
            python scripts/ci/perf_snapshot.py --mode baseline --repeat 5 --output test_results/perf/baseline.json
            python scripts/ci/perf_snapshot.py --mode optimized --repeat 5 --output test_results/perf/optimized.json
            python scripts/ci/perf_guard.py \
              --baseline test_results/perf/baseline.json \
              --optimized test_results/perf/optimized.json \
              --report test_results/perf/comparison.md \
              --min-improvement 0.50 \
              --max-regression 0.05
          '

      - name: Upload perf artifacts (macOS)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: perf-macos
          path: |
            test_results/perf/baseline.json
            test_results/perf/optimized.json
            test_results/perf/comparison.md
          if-no-files-found: warn
